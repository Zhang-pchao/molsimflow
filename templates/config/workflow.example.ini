[scheduler]
ENV_SETUP_SCRIPT = /path/to/private/setup_env.sh
MOLSIMFLOW_SOURCE_DIR = /path/to/molsimflow
PYTHON_BIN = python
PACKMOL_COMMAND = packmol

[structure]
STRUCTURE_MODE = prebuilt
INTERFACE_STRUCTURE = inputs/interface.xyz
MOLECULE_DIR = inputs/molecule_templates
OUTPUT_DIR = generated_case
GAS_RADIUS_1 = 19
GAS_RADIUS_2 = 14
BUBBLE_SPACING = 50
RUN_PACKMOL = 1
RUN_CONVERSION = 1

[conversion]
POSCAR_PATH = generated_case/POSCAR
EXTXYZ_OUTPUT = generated_case/model.xyz
LAMMPS_DATA_OUTPUT = generated_case/model_atomic.data

[postprocess]
TRAJECTORY = analysis/run.lammpstrj
LAMMPS_DATA = analysis/model_atomic.data
OUTPUT_ROOT = analysis_outputs
