[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molsimflow"
version = "0.1.0"
description = "Reusable molecular-simulation workflow tools for structure preparation, PLUMED generation, and MD analysis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "numpy",
]

[project.optional-dependencies]
analysis = [
  "matplotlib",
  "MDAnalysis",
  "pandas",
  "seaborn",
  "scipy",
]
structure = [
  "ase",
]
deepmd-sketch = [
  "ase",
  "deepmd-kit",
  "dpdata",
  "matplotlib",
  "scikit-learn",
]
media = [
  "imageio",
  "imageio-ffmpeg",
  "Pillow",
]
dev = [
  "pytest",
  "ruff",
]

[project.scripts]
molsimflow = "molsimflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
